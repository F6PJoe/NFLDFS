name: Run NFL DFS R Script
#update

on:
  workflow_dispatch:  # Enables manual trigger from GitHub UI
  #schedule:
    # Wed-Sat: 8 AM ET (12:00 UTC)
 #   - cron: '0 12 * * 3-6'

    # Wed-Sat: 12 PM ET (16:00 UTC)
#    - cron: '0 16 * * 3-6'

    # Wed-Sat: 8 PM ET (00:00 UTC next day)
#    - cron: '0 0 * * 4-6,0'

    # Sunday: 8 AM–11 AM ET every 30 minutes (12:00–14:59 UTC)
 #   - cron: '0,30 12-14 * * 0'

    # Sunday: 11 AM–1 PM ET every 5 minutes (15:00–16:59 UTC)
#    - cron: '*/5 15-16 * * 0'

jobs:
  run_script:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up R
      id: setup-r
      uses: r-lib/actions/setup-r@v2

    - name: Install R packages (plus any system libraries they need)
      uses: r-lib/actions/setup-r-dependencies@v2
      with:
        packages: |
          any::googlesheets4
          any::googledrive
          any::dplyr
          any::lubridate
          any::stringr
          any::rjson
          any::httr
          any::base64enc
          any::magrittr
          any::plyr
          any::RCurl
          any::XML
        cache-version: 2

    - name: Check installed R packages
      run: |
        Rscript -e 'cat("Loaded packages:\n"); print(.packages())'

    - name: Run R script
      env:
        GCP_SHEETS_KEY_B64: ${{ secrets.GCP_SHEETS_KEY_B64 }}
        BCDFS_API_KEY: ${{ secrets.BCDFS_API_KEY }}
      run: |
        Rscript "NFLDFS.R"
